# RCU Systems Atlas: source catalog
# Riverside Christian University is a fictional fixture institution.
# Vendor and product names below are fictional except Microsoft Entra ID / M365,
# Salesforce, and the federal and national reporting bodies.
#
# This file is the single source of truth. Every map, impact radius, and drift
# report is rendered from it. Change the file, and the views change.
#
# Schema
#   meta         as_of date, verification threshold, owner of this file
#   lifecycles   one ordered track of stages per kind of person (student, employee);
#                one stage per track may mark the handoff
#   systems      what exists: layer, owners, vendor, runs_on (platform underneath),
#                and signin when people reach it some way other than an sso interface
#   interfaces   what moves between a pair of systems: kind, method, frequency, owner,
#                criticality, compliance, failure mode, and provenance
#                (fact_source + last_verified). One interface per pair.
#   domains      which system is the record for each kind of data, by lifecycle stage
#   scenarios    named starting points for the impact radius
#   observations telemetry snapshots the claims are checked against (drift)
#
# Interface kinds: data (records move), sso (sign-in only; blocks people, not feeds)
# Frequencies:     realtime, hourly, nightly, daily, weekly, monthly, term, annual, on-demand
# Compliance:      FERPA, GLBA, Title IV, IPEDS. Filterable in every view.
#
# Fields (carries) flow from -> to by default. A field written as a mapping can
# set flow: back (to -> from) or flow: both, and override frequency, method,
# compliance, fact_source and last_verified for that field only:
#   carries:
#     - enrollment
#     - {field: final grade, flow: back, frequency: term, compliance: [FERPA]}
#
# Sign-in (systems.signin): record how people get in when it isn't an sso
# interface. method: local | self-registration | none. Applications and services
# with neither an sso interface nor a signin fact show up in the drift report.

meta:
  institution: Riverside Christian University
  short_name: RCU
  as_of: "2026-11-08"
  verify_threshold_days: 180
  steward: Office of Data Intelligence
  fixture: true

lifecycles:
  - id: student
    name: Student
    stages:
      - {id: prospect,  name: Prospect}
      - {id: applicant, name: Applicant}
      - {id: admitted,  name: Admitted}
      - {id: deposited, name: Deposited, handoff: true}
      - {id: enrolled,  name: Enrolled}
      - {id: graduate,  name: Graduate}
      - {id: alum,      name: Alum}
  - id: employee
    name: Employee
    stages:
      - {id: candidate, name: Candidate}
      - {id: hired,     name: Offer accepted, handoff: true}
      - {id: active,    name: Active}
      - {id: separated, name: Separated}

# column places each layer left to right in grouped maps, following the data flow.
layers:
  - {id: relationship, name: Relationship,       column: 0}
  - {id: record,       name: Record,             column: 1}
  - {id: identity,     name: Identity,           column: 1}
  - {id: engagement,   name: Campus services,    column: 2}
  - {id: analytics,    name: Analytics,          column: 3}
  - {id: external,     name: External reporting, column: 3}

systems:
  - id: sfdc
    name: Salesforce platform
    short: Salesforce
    layer: relationship
    kind: platform
    vendor: Salesforce
    owner: IT Applications
    tech_owner: IT Applications
    summary: Platform underneath the recruitment CRM and online application.

  - id: lantern
    name: Lantern Recruit
    short: Lantern Recruit
    layer: relationship
    kind: application
    vendor: Lantern Higher Ed
    runs_on: sfdc
    owner: Admissions
    tech_owner: IT Applications
    summary: Recruitment CRM. Inquiries, outreach, events, the admissions funnel.

  - id: apply
    name: Lantern Apply
    short: Lantern Apply
    layer: relationship
    kind: application
    vendor: Lantern Higher Ed
    runs_on: sfdc
    owner: Admissions
    tech_owner: IT Applications
    summary: Online application and application review.
    signin:
      method: self-registration
      note: Applicants create their own accounts. Staff review applications inside Lantern Recruit.
      fact_source: Platform login settings
      last_verified: "2026-08-02"

  - id: ats
    name: Beacon Hire
    short: Beacon Hire
    layer: relationship
    kind: application
    vendor: Beacon Talent
    owner: Human Resources
    tech_owner: IT Applications
    summary: Job postings, candidates, interviews, and offers.

  - id: pay
    name: TrueLane Pay
    short: TrueLane Pay
    layer: record
    kind: service
    vendor: TrueLane Payments
    owner: Business Office
    tech_owner: IT Applications
    summary: Payment gateway for application fees, deposits, and tuition.
    signin:
      method: local
      note: Business Office staff use passwords in the vendor portal. Removed by hand at separation.
      fact_source: Gateway portal user list
      last_verified: "2026-07-10"

  - id: sis
    name: Cornerstone SIS
    short: Cornerstone SIS
    layer: record
    kind: application
    vendor: Cornerstone Campus Systems
    owner: Registrar
    tech_owner: IT Applications
    summary: System of record. Registration, academic records, aid, billing, degree audit.
    signin:
      method: local
      note: Staff use separate passwords in the SIS desktop client. Students and faculty come in through MyRCU.
      fact_source: SIS security user list
      last_verified: "2026-08-04"

  - id: hr
    name: Keystone HR and Payroll
    short: Keystone HR
    layer: record
    kind: application
    vendor: Keystone Workforce
    owner: Human Resources
    tech_owner: IT Applications
    summary: System of record for employees. Positions, supervisors, pay, benefits, separations.

  - id: portal
    name: MyRCU portal
    short: MyRCU
    layer: engagement
    kind: application
    vendor: Cornerstone Campus Systems
    runs_on: sis
    owner: Registrar
    tech_owner: IT Applications
    summary: Student and faculty self-service. A window into the SIS.

  - id: provision
    name: Account provisioning job
    short: Provisioning job
    layer: identity
    kind: integration
    vendor: In-house (PowerShell)
    owner: IT Infrastructure
    tech_owner: IT Infrastructure
    summary: Creates and disables accounts from SIS student data and HR employee data.

  - id: idm
    name: Entra ID + Microsoft 365
    short: Entra ID / M365
    layer: identity
    kind: platform
    vendor: Microsoft
    owner: IT Infrastructure
    tech_owner: IT Infrastructure
    summary: Identity, sign-in, email, and collaboration for everyone.

  - id: lms
    name: Commons LMS
    short: Commons LMS
    layer: engagement
    kind: application
    vendor: Commons Learning
    owner: Academic Affairs
    tech_owner: Instructional Technology
    summary: Courses, assignments, and gradebooks.

  - id: housing
    name: Roost Housing
    short: Roost Housing
    layer: engagement
    kind: application
    vendor: Roost Software
    owner: Residence Life
    tech_owner: IT Applications
    summary: Room selection, assignments, and housing charges.

  - id: onecard
    name: OneCard ID and door access
    short: OneCard
    layer: engagement
    kind: application
    vendor: OneCard Systems
    owner: Campus Safety
    tech_owner: IT Infrastructure
    summary: ID cards and building door access.

  - id: advising
    name: Compass Advising
    short: Compass Advising
    layer: engagement
    kind: application
    vendor: Compass Student Success
    owner: Student Success
    tech_owner: IT Applications
    summary: Advising notes, early alerts, and caseloads.

  - id: hub
    name: RCU Data Hub
    short: Data Hub
    layer: analytics
    kind: application
    vendor: In-house (warehouse + Power BI)
    owner: Data Intelligence
    tech_owner: Data Intelligence
    summary: Warehouse and dashboards for enrollment, retention, and finance.

  - id: advancement
    name: Harvest Advancement
    short: Harvest Advancement
    layer: engagement
    kind: application
    vendor: Harvest Nonprofit Software
    owner: Advancement
    tech_owner: IT Applications
    summary: Alumni relations and giving.
    signin:
      method: local
      note: Separate passwords, removed by hand. The spring review found two retired gift officers still active.
      fact_source: Harvest user list
      last_verified: "2026-06-15"

  - id: fsa
    name: Federal Student Aid (ISIR / COD)
    short: Federal Student Aid
    layer: external
    kind: external
    vendor: U.S. Department of Education
    owner: Financial Aid
    tech_owner: IT Applications
    summary: Aid eligibility records in, disbursement records out.

  - id: nsc
    name: National Student Clearinghouse
    short: Clearinghouse
    layer: external
    kind: external
    vendor: National Student Clearinghouse
    owner: Registrar
    tech_owner: IT Applications
    summary: Enrollment and degree verification reporting.

  - id: ipeds
    name: IPEDS (NCES)
    short: IPEDS
    layer: external
    kind: external
    vendor: National Center for Education Statistics
    owner: Institutional Research
    tech_owner: Data Intelligence
    summary: Required federal surveys.

interfaces:
  - id: if-01
    name: Admit and deposit handoff
    from: lantern
    to: sis
    kind: data
    carries:
      - person
      - application decision
      - {field: deposit, compliance: [GLBA]}
    method: Vendor API connector
    frequency: nightly
    trigger: Admitted and deposit paid; nightly sweep catches stragglers
    owner: Admissions
    criticality: high
    failure_mode: Admitted students never reach the SIS, so they can't register or get accounts.
    fact_source: SIS import job log
    last_verified: "2026-09-14"

  - id: if-02
    name: Submitted applications
    from: apply
    to: lantern
    kind: data
    carries: [application, documents]
    method: Native platform object
    frequency: realtime
    owner: Admissions
    criticality: high
    failure_mode: Applications sit outside the funnel; no review queue.
    fact_source: Platform audit trail
    last_verified: "2026-08-02"

  - id: if-03
    name: Application fees and deposits
    from: pay
    to: lantern
    kind: data
    carries: [payment, deposit]
    method: Webhook
    frequency: realtime
    owner: Business Office
    criticality: high
    compliance: [GLBA]
    failure_mode: Deposits go unrecorded, so the handoff to the SIS never fires.
    fact_source: Gateway settlement report
    last_verified: "2025-11-20"

  - id: if-04
    name: Funnel extract
    from: lantern
    to: hub
    kind: data
    carries: [inquiries, applications, funnel stage]
    method: ETL
    frequency: nightly
    owner: Data Intelligence
    criticality: medium
    failure_mode: Enrollment forecasts and funnel dashboards go stale.
    fact_source: ETL run log
    last_verified: "2026-10-01"

  - id: if-05
    name: Student feed for accounts
    from: sis
    to: provision
    kind: data
    carries: [person, enrollment status]
    method: Flat file (SFTP)
    frequency: nightly
    owner: IT Infrastructure
    criticality: high
    failure_mode: New students get no accounts; withdrawn students keep access.
    fact_source: Provisioning job log
    last_verified: "2026-10-20"

  - id: if-06
    name: Account create and disable
    from: provision
    to: idm
    kind: data
    carries: [account, group membership]
    method: Microsoft Graph API
    frequency: nightly
    owner: IT Infrastructure
    criticality: high
    failure_mode: Accounts are not created or not disabled.
    fact_source: Entra ID audit log
    last_verified: "2026-10-20"

  - id: if-07
    name: Staff sign-in to recruitment CRM
    from: idm
    to: lantern
    kind: sso
    carries: [sign-in]
    method: SAML
    frequency: realtime
    owner: IT Infrastructure
    criticality: high
    failure_mode: Admissions staff can't sign in.
    fact_source: Entra ID enterprise applications
    last_verified: "2026-06-30"

  - id: if-08
    name: Portal sign-in
    from: idm
    to: portal
    kind: sso
    carries: [sign-in]
    method: SAML
    frequency: realtime
    owner: IT Infrastructure
    criticality: high
    failure_mode: Students and faculty can't reach self-service.
    fact_source: Entra ID enterprise applications
    last_verified: "2026-06-30"

  - id: if-09
    name: LMS sign-in
    from: idm
    to: lms
    kind: sso
    carries: [sign-in]
    method: OIDC
    frequency: realtime
    owner: IT Infrastructure
    criticality: high
    failure_mode: No one can reach courses.
    fact_source: Entra ID enterprise applications
    last_verified: "2026-06-30"

  - id: if-10
    name: Advising sign-in
    from: idm
    to: advising
    kind: sso
    carries: [sign-in]
    method: SAML
    frequency: realtime
    owner: IT Infrastructure
    criticality: medium
    failure_mode: Advisors can't sign in.
    fact_source: Entra ID enterprise applications
    last_verified: "2025-12-01"

  - id: if-11
    name: Housing sign-in
    from: idm
    to: housing
    kind: sso
    carries: [sign-in]
    method: SAML
    frequency: realtime
    owner: IT Infrastructure
    criticality: medium
    failure_mode: Students can't select rooms; staff can't manage assignments.
    fact_source: Entra ID enterprise applications
    last_verified: "2026-06-30"

  - id: if-12
    name: Rosters out, final grades back
    from: sis
    to: lms
    kind: data
    carries:
      - person
      - enrollment
      - section
      - field: final grade
        flow: back
        method: Grade passback
        frequency: term
        fact_source: Registrar grade audit
        last_verified: "2026-05-20"
    method: Vendor API
    frequency: hourly
    owner: Instructional Technology
    criticality: high
    compliance: [FERPA]
    failure_mode: Students missing from courses or drops still enrolled; grades of record late or wrong on transcripts.
    fact_source: LMS sync log
    last_verified: "2026-09-02"

  - id: if-14
    name: Student self-service
    from: sis
    to: portal
    kind: data
    carries:
      - schedule
      - grades
      - {field: account balance, compliance: [GLBA]}
      - {field: aid, compliance: [GLBA, Title IV]}
    method: Native module
    frequency: realtime
    owner: Registrar
    criticality: high
    compliance: [FERPA]
    failure_mode: Students see stale or missing records.
    fact_source: Portal health check
    last_verified: "2026-08-15"

  - id: if-15
    name: Tuition payments
    from: pay
    to: sis
    kind: data
    carries: [payment]
    method: Vendor API
    frequency: realtime
    owner: Business Office
    criticality: high
    compliance: [GLBA]
    failure_mode: Payments don't post; holds and late fees fire in error.
    fact_source: Gateway settlement report
    last_verified: "2026-07-10"

  - id: if-16
    name: Federal aid exchange (ISIR in, COD out)
    from: fsa
    to: sis
    kind: data
    carries:
      - aid eligibility
      - field: disbursement
        flow: back
        frequency: weekly
        fact_source: COD acknowledgment files
        last_verified: "2026-10-05"
    method: SAIG file transfer
    frequency: daily
    owner: Financial Aid
    criticality: high
    compliance: [Title IV, GLBA]
    failure_mode: Aid packaging stalls and verification deadlines slip; late disbursement reporting is a program review finding.
    fact_source: SAIG mailbox log
    last_verified: "2026-10-05"

  - id: if-18
    name: Enrollment reporting
    from: sis
    to: nsc
    kind: data
    carries: [enrollment status]
    method: Flat file upload
    frequency: monthly
    owner: Registrar
    criticality: high
    compliance: [Title IV]
    failure_mode: Loan servicers see wrong status; borrowers enter repayment early.
    fact_source: Clearinghouse error reports
    last_verified: "2026-09-30"

  - id: if-19
    name: IPEDS surveys
    from: sis
    to: ipeds
    kind: data
    carries: [enrollment, completions, finance]
    method: Manual export and entry
    frequency: annual
    owner: Institutional Research
    criticality: medium
    compliance: [IPEDS]
    failure_mode: Late or inaccurate federal reporting.
    fact_source: Keyholder submission record
    last_verified: "2026-02-15"

  - id: if-20
    name: Records extract
    from: sis
    to: hub
    kind: data
    carries:
      - enrollment
      - grades
      - {field: finance, compliance: [GLBA]}
    method: ETL
    frequency: nightly
    owner: Data Intelligence
    criticality: medium
    compliance: [FERPA]
    failure_mode: Retention and finance dashboards go stale.
    fact_source: ETL run log
    last_verified: "2026-10-01"

  - id: if-21
    name: Eligible residents out, room charges back
    from: sis
    to: housing
    kind: data
    carries:
      - person
      - enrollment status
      - field: room and board charges
        flow: back
        frequency: weekly
        compliance: [GLBA]
        fact_source: Business Office charge reconciliation
        last_verified: "2026-03-01"
    method: Flat file (SFTP)
    frequency: nightly
    owner: Residence Life
    criticality: high
    failure_mode: Eligible students can't select rooms; housing charges go missing from student bills.
    fact_source: Housing import log
    last_verified: "2026-08-01"

  - id: if-23
    name: Active status for ID cards
    from: sis
    to: onecard
    kind: data
    carries: [person, active status, photo]
    method: Flat file (SFTP)
    frequency: nightly
    owner: Campus Safety
    criticality: medium
    failure_mode: New students can't get cards; withdrawn students keep them.
    fact_source: OneCard import log
    last_verified: "2026-07-15"

  - id: if-24
    name: Door access by room
    from: housing
    to: onecard
    kind: data
    carries: [room assignment]
    method: Flat file (SFTP)
    frequency: nightly
    owner: Campus Safety
    criticality: high
    failure_mode: Students locked out of their halls, or still able to enter old ones.
    fact_source: OneCard import log
    last_verified: "2025-09-10"

  - id: if-25
    name: Rosters and midterm grades
    from: sis
    to: advising
    kind: data
    carries: [person, enrollment, midterm grade]
    method: Vendor API
    frequency: daily
    owner: Student Success
    criticality: medium
    compliance: [FERPA]
    failure_mode: Early alerts miss struggling students.
    fact_source: Advising sync log
    last_verified: "2026-09-01"

  - id: if-26
    name: Graduates at conferral
    from: sis
    to: advancement
    kind: data
    carries: [person, degree, contact]
    method: Flat file
    frequency: term
    owner: Advancement
    criticality: medium
    failure_mode: New alumni never enter the alumni record.
    fact_source: Advancement load report
    last_verified: "2026-05-30"

  - id: if-27
    name: Admit profile for early alerts
    from: lantern
    to: advising
    kind: data
    carries: [first-generation flag, high school GPA, intended major]
    method: ETL
    frequency: nightly
    owner: Student Success
    criticality: medium
    failure_mode: First-year risk models start the term blind.
    fact_source: Advising sync log
    last_verified: "2026-04-10"

  - id: if-28
    name: Deposited students for housing
    from: lantern
    to: housing
    kind: data
    carries: [person, deposit, housing preference]
    method: Flat file (SFTP)
    frequency: nightly
    owner: Residence Life
    criticality: medium
    failure_mode: New students can't pre-select rooms before they reach the SIS.
    fact_source: Housing import log
    last_verified: "2025-06-01"

  - id: if-29
    name: Data Hub sign-in
    from: idm
    to: hub
    kind: sso
    carries: [sign-in]
    method: OIDC (native to Power BI)
    frequency: realtime
    owner: IT Infrastructure
    criticality: medium
    failure_mode: Dashboards unreachable.
    fact_source: Entra ID enterprise applications
    last_verified: "2026-06-30"

  - id: if-30
    name: Offer accepted handoff
    from: ats
    to: hr
    kind: data
    carries: [person, position, start date, offer]
    method: Vendor API
    frequency: daily
    trigger: Offer accepted and background check cleared
    owner: Human Resources
    criticality: high
    failure_mode: New hires never reach HR, so no pay, no accounts, no ID card on day one.
    fact_source: HR import log
    last_verified: "2026-08-20"

  - id: if-31
    name: Employee feed for accounts
    from: hr
    to: provision
    kind: data
    carries: [person, position, department, employment status]
    method: Flat file (SFTP)
    frequency: nightly
    owner: IT Infrastructure
    criticality: high
    failure_mode: New hires start without accounts; separated employees keep access.
    fact_source: Provisioning job log
    last_verified: "2026-10-20"

  - id: if-32
    name: Employee status for ID cards
    from: hr
    to: onecard
    kind: data
    carries: [person, employment status, department]
    method: Flat file (SFTP)
    frequency: nightly
    owner: Campus Safety
    criticality: high
    failure_mode: Separated employees keep door access; new hires wait for cards.
    fact_source: OneCard import log
    last_verified: "2025-10-02"

  - id: if-33
    name: Faculty appointments
    from: hr
    to: sis
    kind: data
    carries: [person, faculty appointment, department]
    method: Flat file (SFTP)
    frequency: nightly
    owner: Registrar
    criticality: medium
    failure_mode: New faculty can't be assigned sections, so LMS courses open with no instructor.
    fact_source: SIS import job log
    last_verified: "2026-08-25"

  - id: if-34
    name: Workforce extract
    from: hr
    to: hub
    kind: data
    carries: [position, department, FTE, salary]
    method: ETL
    frequency: nightly
    owner: Data Intelligence
    criticality: medium
    failure_mode: Staffing, budget, and IPEDS HR survey figures go stale.
    fact_source: ETL run log
    last_verified: "2026-10-01"

  - id: if-35
    name: Hiring manager sign-in
    from: idm
    to: ats
    kind: sso
    carries: [sign-in]
    method: SAML
    frequency: realtime
    owner: IT Infrastructure
    criticality: medium
    failure_mode: Hiring managers can't review candidates. Candidates use their own accounts.
    fact_source: Entra ID enterprise applications
    last_verified: "2026-06-30"

  - id: if-36
    name: HR and payroll sign-in
    from: idm
    to: hr
    kind: sso
    carries: [sign-in]
    method: SAML
    frequency: realtime
    owner: IT Infrastructure
    criticality: high
    failure_mode: Employees can't see pay stubs or benefits; HR can't process changes.
    fact_source: Entra ID enterprise applications
    last_verified: "2026-06-30"

domains:
  - id: contact
    name: Name and contact
    record:
      - {system: lantern,     stages: [prospect, applicant, admitted]}
      - {system: sis,         stages: [deposited, enrolled, graduate]}
      - {system: advancement, stages: [alum]}

  - id: comms
    name: Communications history
    record:
      - {system: lantern,     stages: [prospect, applicant, admitted, deposited]}
      - {system: advancement, stages: [alum]}

  - id: application
    name: Application and decision
    record:
      - {system: lantern, stages: [applicant, admitted]}
      - {system: sis,     stages: [deposited, enrolled, graduate, alum]}

  - id: account
    name: Deposits and student account
    record:
      - {system: lantern, stages: [admitted, deposited]}
      - {system: sis,     stages: [deposited, enrolled, graduate]}

  - id: aid
    name: Financial aid
    record:
      - {system: sis, stages: [admitted, deposited, enrolled]}

  - id: registration
    name: Registration
    record:
      - {system: sis, stages: [enrolled]}

  - id: academic
    name: Academic record
    record:
      - {system: sis, stages: [enrolled, graduate, alum]}

  - id: housing
    name: Housing assignment
    record:
      - {system: housing, stages: [deposited, enrolled]}

  - id: coursework
    name: Course activity
    note: Grades of record live in the SIS.
    record:
      - {system: lms, stages: [enrolled]}

  - id: advising
    name: Advising notes and alerts
    record:
      - {system: advising, stages: [enrolled]}

  - id: signin
    name: Sign-in account
    record:
      - {system: idm, stages: [deposited, enrolled, graduate]}

  - id: giving
    name: Giving and engagement
    record:
      - {system: advancement, stages: [graduate, alum]}

  # Employee lifecycle. Domains default to the student track unless they name another.
  - id: emp-candidate
    lifecycle: employee
    name: Application and offer
    record:
      - {system: ats, stages: [candidate, hired]}

  - id: emp-contact
    lifecycle: employee
    name: Name and contact
    record:
      - {system: ats, stages: [candidate]}
      - {system: hr,  stages: [hired, active, separated]}

  - id: emp-position
    lifecycle: employee
    name: Position and pay
    record:
      - {system: hr, stages: [hired, active, separated]}

  - id: emp-supervisor
    lifecycle: employee
    name: Supervisor and department
    note: The help desk hand-edits the manager field in Entra ID because the employee feed doesn't carry it.
    record:
