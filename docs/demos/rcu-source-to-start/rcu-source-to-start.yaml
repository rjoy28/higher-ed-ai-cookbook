  - {id: organic, name: Organic search, paid: false, platform: "GA4 form_submit, organic", steward: Marketing}
  - {id: referral, name: Referral and alumni, paid: false, platform: null, steward: Admissions}
  - {id: events, name: Events and info sessions, paid: false, platform: null, steward: Admissions}
  - {id: web, name: Unattributed web, paid: false, unattributed: true, platform: "GA4 form_submit, direct and other", steward: Marketing}
