# RCU Source-to-Start Reconciliation: source file
# Riverside Christian University is a fictional fixture institution. Synthetic data.
#
# This file is the single source of truth for the page. It joins what marketing
# paid for with what admissions recorded, for one recruiting cycle, at the
# segment level. Every number is a count or a dollar total. There are no
# student rows here, and the page cannot produce any.
#
# Schema
#   meta          institution, cycle, what a start means, attribution rule, as_of
#   settings      tolerance: largest gap between a platform count and the admissions
#                   count before a month is flagged (default 0.10)
#                 min_gap: a month is flagged only if the counts also differ by at
#                   least this many inquiries, so tiny months don't trip it (default 3)
#                 min_starts: fewest starts a channel needs before the page prices
#                   it per start (default 10)
#                 allocate: false leaves unattributed web starts unattributed; true
#                   shares them out (see Rules). A judgment call, so it defaults off.
#   channels      where students come from. paid: true means media spend is tracked.
#                 platform: the system that counts inquiries before admissions does.
#   crosswalk     admissions source code -> channel id. null means nobody mapped it.
#   spend         media spend by channel and segment for the cycle, from billing.
#   admissions    by source code and segment: [inquiries, applications, starts].
#   ties          segment totals the admissions rows must add up to (recipe 05).
#   audit         by channel, one [platform count, admissions count] pair per month.
#   fact_sources  the one named source for each stage, and who keeps it.
#   events        changes a person recorded, so a flag has a reason next to it.
#
# Rules the page applies
#   cost per stage   spend / that stage's count, by channel; shown only when the
#                    channel has a mapped source code
#   priced per start only when starts >= min_starts; otherwise "too few starts"
#   gap              (platform - admissions) / platform; flagged when |gap| > tolerance
#                    and |platform - admissions| >= min_gap
#   allocation       in months where the unattributed web row is flagged, the excess
#                    of admissions over the platform count is lost attribution. That
#                    share of the unattributed pool (inquiries, applications, starts)
#                    is split across website-form channels by their platform counts
#                    in those months. Everything else stays unattributed.
#   ties             each segment's admissions rows must add up to its tie row

meta:
  institution: Riverside Christian University
  short_name: RCU
  as_of: "2026-10-15"
  cycle: Fall 2026 starts (inquiries Sep 2025 to Aug 2026)
  start_means: Enrolled at the fall census, from the registrar's census file
  attribution: The first source the CRM recorded for the person (first touch)
  segments: [Online UG, Graduate]
  scope: Online undergraduate and graduate programs. Traditional undergraduate recruiting runs on travel and visits, not media, and is out of scope.
  fixture: true

settings:
  tolerance: 0.10
  min_gap: 3
  min_starts: 10
  allocate: false

months: ["Sep 2025", "Oct 2025", "Nov 2025", "Dec 2025", "Jan 2026", "Feb 2026", "Mar 2026", "Apr 2026", "May 2026", "Jun 2026", "Jul 2026", "Aug 2026"]

