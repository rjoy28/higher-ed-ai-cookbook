events:
  - month: Mar 2026
    channel: meta
    what: The integration account's password was rotated under the 90-day policy. The Meta lead sync stopped for nine days, and nobody was alerted.
  - month: Jun 2026
    channel: web
    what: The refreshed program-page template went live without the hidden fields that carry a visitor's source into the inquiry form. The CRM codes a form with no source as plain WEB.
  - month: Aug 2026
    channel: web
    what: An enrollment counselor asked why every summer inquiry said WEB. The fields were restored on August 19.
  - month: Feb 2026
    channel: youtube
    what: Marketing ran a three-month YouTube pilot with its own source code, WEB-YT. The code was never added to the crosswalk.
  - month: Sep 2025
    channel: vendor
    what: The vendor contract allows a credit for any lead already in the CRM in the prior 90 days, at the $55 lead price.
  - month: Sep 2025
    channel: other
    what: The first entry in the CRM's source dropdown has been Other since the 2019 go-live. The online undergraduate application doesn't ask how a student heard about RCU, so an application with no prior inquiry is coded Other.
