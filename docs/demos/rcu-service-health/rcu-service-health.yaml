# RCU IT Service Health: source file
# Riverside Christian University is a fictional fixture institution. Synthetic data.
#
# This file is the single source of truth for the page. It holds the help-desk
# export exactly as received, the pre-flight decisions a person confirmed, and
# the SLA bands. Every view is computed from it.
#
# Schema
#   meta        institution, period, steward, as_of
#   settings    on_target and watch: SLA attainment bands (recipe 02 defaults 0.90 / 0.80)
#               checks: which pre-flight steps to apply (true = apply)
#   canonical   the category, priority, and team lists the analysis expects
#   aliases     old or variant labels -> canonical label. Mapped only when the
#               category or priority check is on. Unlisted variants stay flagged.
#   preflight   one entry per check: what a person found and confirmed. Counts and
#               row numbers on the page are computed from the export, not copied.
#               minutes.rows lists the rows a person confirmed were logged in minutes;
#               the page also flags any other row more than 40 times its category's
#               median time, but converts only confirmed rows.
#   tickets     the export as received: [row, category, priority, month, SLA target
#               (hrs), resolution (hrs), the export's own In SLA? flag, assigned team].
#               row is the row number in the export file.
#
# Rules the page applies
#   in SLA          resolution <= SLA target, recomputed (the export's flag is not trusted)
#   attainment      tickets in SLA / tickets, for each cut
#   status          On target >= on_target; Watch >= watch; Below target otherwise
#   short of target tickets that would have to move inside SLA for a cut to reach
#                   on_target: ceil(on_target x tickets) - tickets in SLA, never below 0
#   duplicates      a row identical to an earlier row in every field but row number
#   unresolved      no resolution time; with the check off they count as missed
#   month formats   "May 2026" and "06/2026" become 2026-05 and 2026-06; with the check
#                   off, unreadable months drop out of the trend only

meta:
  institution: Riverside Christian University
  short_name: RCU
  as_of: "2026-07-02"
  period: January to June 2026
  steward: IT Service Desk
  fixture: true

settings:
  on_target: 0.90
  watch: 0.80
  checks: {duplicates: true, unresolved: true, minutes: true, priority_labels: true, category_labels: true, month_formats: true}

canonical:
  categories: [AV / Classroom Tech, Account/Access, Data/Reporting, ERP, Email & Collaboration, Hardware, LMS, Network/Wi-Fi, Phone/VoIP, Printing, Security/Phishing, Software Install]
  priorities: [P1, P2, P3, P4]
  teams: [AV Services, Data Services, Enterprise Apps, Help Desk, Infrastructure, Security]

aliases:
  categories: {"Email & Collab": Email & Collaboration, "Wi-Fi / Network": Network/Wi-Fi}
  priorities: {"Priority 3": P3, "p4": P4, "Critical": P1}

preflight:
  - id: duplicates
    check: Duplicate rows
    context: All are LMS tickets from the night the online learning system went offline, logged once by phone and again by email.
    handled: The help-desk lead confirmed they were double-logged. One copy of each was kept.
    confirmed_by: Help-desk lead
  - id: unresolved
    check: Unresolved tickets
    context: Still open when the export ran. One also has no assigned team.
    handled: Set aside. Open tickets can't be scored against SLA yet; they will appear in next month's export.
    confirmed_by: Help-desk lead
  - id: minutes
    check: Mixed units
    context: These came from the phone-intake form, which records minutes instead of hours.
    handled: Converted from minutes to hours, only after confirmation, and In SLA recomputed. The export's own flag was computed on minutes.
    confirmed_by: Help-desk lead
    rows: [28, 77, 102]
  - id: priority_labels
    check: Priority labels
    context: "'Critical' is the old phone-intake label for P1. The others are typing variants."
    handled: Mapped to P1 to P4 through the alias list.
    confirmed_by: Help-desk lead
  - id: category_labels
    check: Category labels
    context: Older category names, from before the catalog was renamed.
    handled: Matched to the current category list through the alias list. Nothing renamed silently.
    confirmed_by: Help-desk lead
  - id: month_formats
    check: Month formats
    context: A few rows write the month as words or as MM/YYYY.
    handled: Normalized to YYYY-MM so months compare like for like.
    confirmed_by: Automatic, format only

