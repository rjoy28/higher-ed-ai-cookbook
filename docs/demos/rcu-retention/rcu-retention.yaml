# RCU Retention Risk: source file
# Riverside Christian University is a fictional fixture institution. Synthetic data.
#
# This file is the single source of truth for the page. It holds first-year
# retention by entry cohort, the same cohorts split by student group, and
# first-year grades in gateway courses. Every number is a group total.
# There are no student rows here, and the page cannot produce any.
#
# Schema
#   meta        institution, cohort definition, steward, as_of
#   settings    goal and approaching: retention bands (recipe 11 defaults 0.75 / 0.70)
#               min_cell: smallest group the page will show (default 10)
#               combine_small: true folds each dimension's small groups into the
#               group named in its combine_into, instead of suppressing them
#   cohorts     [entry cohort, cohort size, retained to year 2 (count), DFW rate].
#               A cohort whose second fall hasn't happened is null, never estimated.
#   dimensions  each splits every cohort into groups. groups: name -> one
#               [size, retained] pair per cohort, in cohort order. Sizes and
#               retained counts must add up to the cohort row; the page checks.
#   gateway     first-year enrollments and D, F and W grades by course:
#               name -> one [enrolled, DFW grades] pair per cohort.
#   events      changes a person recorded, so a shift in the numbers has a
#               reason next to it.
#
# Rules the page applies
#   retained %      retained / cohort size
#   status          At goal >= goal; Approaching >= approaching; Below goal otherwise
#   students to goal  ceil(goal x size) - retained, never below 0
#   suppression     a group smaller than min_cell is not shown. If that leaves one
#                   hidden group in a cohort, the next-smallest group is hidden too,
#                   so the hidden one can't be recovered by subtraction.
#   fixed mix       the latest cohort's group rates, weighted by the first cohort's
#                   group shares. Computed only when no group is hidden.
#   DFW rate        DFW grades / gateway enrollments; it reconciles to the cohort row

meta:
  institution: Riverside Christian University
  short_name: RCU
  as_of: "2026-10-15"
  cohort_definition: First-time undergraduates, traditional and online, entering in fall
  retained_means: Enrolled at the second fall census
  steward: Institutional Research
  fixture: true

settings:
  goal: 0.75
  approaching: 0.70
  min_cell: 10
  combine_small: false

cohorts:
  - ["Fall 2022", 480, 317, 0.145]
  - ["Fall 2023", 488, 327, 0.138]
  - ["Fall 2024", 500, 340, 0.131]
  - ["Fall 2025", 511, 353, 0.126]
  - ["Fall 2026", 524, null, null]

