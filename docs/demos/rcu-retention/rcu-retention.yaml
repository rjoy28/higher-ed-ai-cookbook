    course: MATH 110 College Algebra
    what: MATH 110 moved to a corequisite model. Students who would have been placed in noncredit MATH 090 now take MATH 110 with a support lab in the same term.
  - cohort: Fall 2025
    course: CHEM 111 General Chemistry I
    what: CHEM 111 lost its second lab instructor. Lab sections went from four to three, with the same number of students.
