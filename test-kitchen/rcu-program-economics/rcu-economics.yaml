# RCU Program Economics: source file
# Riverside Christian University is a fictional fixture institution. Synthetic data.
#
# This file is the single source of truth for the demo. It joins three recipe
# inputs that are usually read on their own:
#   programs   Academic Portfolio Analyst (01): headcount by program by year
#   segments   Net Tuition & Discount Analyzer (17): tuition and aid by segment by year
#   sections   Course Section Viability Analyzer (16): the Fall 2026 section export
# and adds the two things a join needs: a subject-to-program map, and the
# allocation rules, kept in settings so a reader can see and change them.
#
# Schema
#   meta       institution, census years in order (aid years use the same order), steward
#   settings   allocation and flag rules (see below)
#   segments   per segment: headcount, gross tuition, institutional aid, funded aid,
#              one value per year in meta.years
#   subjects   course prefix -> program name, or {program: null, note} for a course
#              that serves several programs. Add a note to explain a mapping.
#   sections   id, course ("PRE ### — Title"), instructor, seat cap, enrolled
#   programs   name, level (must match a segment), school, online share in the
#              latest year, headcount by year, optional note
#
# Rules the page applies
#   discount rate      institutional aid / gross tuition (recipe 17)
#   sticker            gross tuition / headcount, per segment and year
#   net per student    sticker x (1 - discount). One rate per segment by default.
#   online_discount    optional, per segment. Gives online students their own rate
#                      and solves the campus rate so the segment's aid still adds up.
#                      null means online and campus students get the segment rate.
#   program net        headcount x net per student, split by the program's online share
#   seat share         a program's enrolled seats in mapped sections / all seats
#   revenue share      a program's net tuition / all net tuition
#   load gap           flag a program when seat share and revenue share differ by
#                      more than load_gap. It compares two shares; it is not a cost.
#   section flags      under-enrolled below cancel_below; near cap at near_cap fill
#                      or above; over cap when enrolled > cap (recipe 16)
#   reconcile          program headcount by level must equal segment headcount, every year

