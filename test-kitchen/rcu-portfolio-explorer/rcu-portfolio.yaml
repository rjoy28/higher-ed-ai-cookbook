# RCU Portfolio Explorer: source file
# Riverside Christian University is a fictional fixture institution. Synthetic data.
#
# This file is the single source of truth for the demo. Every chart, table, and
# finding on the page is computed from it. Change the file, and the views change.
#
# Shape: this is the Academic Portfolio Analyst Input Template (one row per program
# per year), folded so each program carries its five census headcounts in order.
#
# Schema
#   meta       institution, census years in order, census date, steward
#   settings   the recipe's configurable thresholds (the Input Template's Config tab)
#   programs   name, level, school, online share in the latest year, headcount by
#              year (same order as meta.years), and an optional note
#
# Rules the page applies (same as the recipe's Sources & Methodology tab)
#   growth rate  CAGR = (latest / earliest) ^ (1 / (years - 1)) - 1
#   trend        Growing above +trend_band, Declining below -trend_band, else Stable
#   tier         Tier 1 >= tier_1, Tier 2 >= tier_2, Tier 3 >= tier_3, else Tier 4
#   share        latest headcount / total latest headcount
#   concentration  share >= concentration_flag; watch >= concentration_watch
#   small base   latest headcount below small_base: read net change, not the rate
#   severity     High when CAGR < -5% and headcount < tier_2

meta:
  institution: Riverside Christian University
  short_name: RCU
  as_of: "2026-11-20"
  years: [Fall 2022, Fall 2023, Fall 2024, Fall 2025, Fall 2026]
  census: Fourth Friday of the fall term
  steward: Institutional Research
  fixture: true

settings:
  tier_1: 50
  tier_2: 20
  tier_3: 8
  trend_band: 0.03
  concentration_flag: 0.15
  concentration_watch: 0.10
  small_base: 30

