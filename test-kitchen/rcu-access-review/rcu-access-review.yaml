  - {id: award-and-pay, pair: [FA.award_adjust, SA.refund_issue], why: One person could raise a student's aid and pay the resulting credit balance out as a refund.}
  - {id: grade-self-approve, pair: [REC.grade_change, REC.grade_approve], why: One person could enter a grade change and approve it.}
  - {id: admin-and-money, pair: [SYS.security_edit, SA.refund_issue], why: One person could grant themselves access and use it to move money.}

