  - {question: When an account was last used, steward: IT Applications, source: SIS sign-in log}
  - {question: Why someone has access outside their job, steward: IT Applications, source: Access-request tickets in the service desk}
  - {question: Which permissions conflict, steward: "Bursar, Registrar and Director of Financial Aid", source: "Conflict rules the three offices agreed, Sept 2026"}
  - {question: What each job should hold, steward: null, source: null, note: Nobody keeps this. The proposed roles are a first draft for the offices to adopt or correct.}

events:
  - {date: "2017-02-06", what: The account provisioning job went live. It disables Entra ID accounts at separation. SIS accounts are local and are removed by hand.}
  - {date: "2019-03-11", what: An admissions counselor was given code-table maintenance to fix a dropdown on the inquiry screen. Nobody took it back.}
  - {date: "2021-06-30", what: The registrar retired. Her SIS account was never closed.}
  - {date: "2021-09-20", what: "An account was set up for the outside auditors. The request said: temporary for audit season."}
  - {date: "2024-01-02", what: A cashier was promoted to student accounts specialist. The new access was added. The old access stayed.}
  - {date: "2026-03-02", what: The bursar was given aid packaging to cover the vacant associate director job in Financial Aid.}
  - {date: "2026-08-17", what: The new associate director of financial aid started.}
  - {date: "2026-09-08", what: "The SIS vendor was given an admin account for the fall upgrade, ending Dec 31."}
