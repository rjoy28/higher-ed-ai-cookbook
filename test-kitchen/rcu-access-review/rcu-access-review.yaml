# RCU Access Review: source file
# Riverside Christian University is a fictional fixture institution. Synthetic data.
#
# This file is the single source of truth for the page. It sets three exports side
# by side: who works at RCU and in what job (the HR system), who can do what in the
# student information system (the SIS security user list), and the access someone
# granted outside a job, with the reason they wrote down. There is no role catalog.
# Proposing one is the point of the page.
#
# Why the drift: staff sign in to the SIS desktop client with separate local
# passwords (see the Systems Atlas). The nightly provisioning job disables Entra ID
# accounts at separation. It never touches the SIS. Access is added when someone
# asks and removed when someone remembers.
#
# Schema
#   meta          institution, as_of, scope
#   settings      min_group: fewest people in a job before the page proposes a role
#                   from them (default 3)
#                 core_share: share of a job's holders who must hold a permission
#                   for it to belong to the proposed role (default 0.75)
#                 typical_share: for jobs too small to propose a role, a permission
#                   counts as normal for the office when at least this share of the
#                   office's other staff hold it (default 0.5)
#                 dormant_days: an account unused this long is flagged (default 180)
#   modules       SIS modules and the office that owns each. null means shared.
#   permissions   id, name, module (the id prefix), sensitive
#   conflicts     pairs of permissions one person should not hold together, and why
#   people        the HR export: position, office, status, hire and separation
#                   dates, and earlier positions at RCU
#   accounts      the SIS security user list: one row per active SIS account. hr is
#                   the person it belongs to, or null for shared, service and
#                   outside accounts, which name an owner instead.
#   grants        access given outside a job, from the access-request log
#   fact_sources  the one named source for each question, and who keeps it
#   events        changes a person recorded, so a flag has a reason next to it
#
# Rules the page applies
#   proposed role   for each position with at least min_group active holders: the
#                   permissions held by at least core_share of them. Confidence is
#                   how many holders match the role exactly.
#   outside role    a permission a role holder has that the role lacks. Labeled
#                   "from an earlier job" when it is in the role (or, failing that,
#                   the usual access) of a position HR says the person held before,
#                   and "granted" when a grant covers it. Otherwise unexplained.
#   missing         a role permission the holder lacks. Usually onboarding.
#   small jobs      positions with fewer than min_group holders get no proposed
#                   role. The page flags only what has evidence: access from an
#                   earlier job, grants, and sensitive permissions in a module
#                   another office owns, unless the office's other staff (or the
#                   other holder of the same job) also hold them.
#   separated       HR says the person left; the account is still active. Flagged
#                   again if it signed in after the separation date.
#   dormant         last sign-in more than dormant_days before as_of (active staff
#                   and non-person accounts; a separated account is flagged as
#                   separated instead)
#   conflict        an account holding both permissions of a conflict pair
#   grants          a grant with no end date, or one past its end date
#   non-person      shared accounts are flagged: nobody can be held to what they
#                   do. Outside accounts need a grant with an end date. Service
#                   accounts need a named owner.
#
# The page proposes and flags. It never removes access. Every flag goes to a
# person, and some can only be settled by one.

meta:
  institution: Riverside Christian University
  short_name: RCU
  as_of: "2026-11-15"
  system: Cornerstone SIS (desktop client)
  scope: Staff accounts in the SIS. Students and faculty reach the SIS through MyRCU and are out of scope.
  fixture: true

settings:
  min_group: 3
  core_share: 0.75
  typical_share: 0.5
  dormant_days: 180

modules:
